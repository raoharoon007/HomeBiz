<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d38"/>
      <stop offset="100%" stop-color="#00241a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe088"/>
      <stop offset="100%" stop-color="#cca72f"/>
    </linearGradient>
  </defs>
  <!-- Smooth rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#hbGradient)"/>
  <!-- Stylized home roof line -->
  <path d="M 18 24 L 32 13 L 46 24" fill="none" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- HB Monogram -->
  <text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">HB</text>
  <!-- Micro sparkle accent -->
  <circle cx="48" cy="15" r="2.5" fill="#ffe088"/>
</svg>
